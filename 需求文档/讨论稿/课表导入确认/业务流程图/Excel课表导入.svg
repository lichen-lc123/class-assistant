<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="360.0">学生｜选择学期及 Excel 导入</tspan>
</text>
<rect x="70" y="489" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="520.5">学生｜上传属于所选学期的</tspan>
<tspan x="290.0" y="543.5">一个或多个课表文件</tspan>
</text>
<polygon points="290.0,661 510,723.0 290.0,785 70,723.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="717.5">系统｜来源限制和文件检查</tspan>
<tspan x="290.0" y="740.5">通过？</tspan>
</text>
<rect x="645" y="683.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="717.5">提示先删除旧来源</tspan>
<tspan x="837.5" y="740.5">或修正文件</tspan>
</text>
<rect x="70" y="833" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="864.5">系统｜展示该学期课程清单</tspan>
<tspan x="290.0" y="887.5">保留各文件的原始学季与来源</tspan>
</text>
<rect x="70" y="1005" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1036.5">学生｜确认疑似重复和上课班</tspan>
<tspan x="290.0" y="1059.5">补充周次或明确日期</tspan>
</text>
<rect x="70" y="1177" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1208.5">系统｜结合日历与作息</tspan>
<tspan x="290.0" y="1231.5">预览课表、冲突和待安排课程</tspan>
</text>
<polygon points="290.0,1349 510,1411.0 290.0,1473 70,1411.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="1417.0">学生｜确认保存？</tspan>
</text>
<rect x="645" y="1371.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="1417.0">取消，不替换原课表</tspan>
</text>
<rect x="70" y="1521" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1564.0">系统｜保存一份学期个人课表</tspan>
</text>
<rect x="70" y="1693" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
