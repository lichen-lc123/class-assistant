<tspan x="290.0" y="1059.5">手机点击加入或移除</tspan>
</text>
<rect x="70" y="1177" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1208.5">系统｜提示重复、具体日期冲突</tspan>
<tspan x="290.0" y="1231.5">以及时间待通知的课程</tspan>
</text>
<polygon points="290.0,1349 510,1411.0 290.0,1473 70,1411.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="1405.5">学生｜确认当前组合</tspan>
<tspan x="290.0" y="1428.5">并接受保留的冲突？</tspan>
</text>
<rect x="645" y="1371.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
