<tspan x="290.0" y="348.5">管理员｜上传课程</tspan>
<tspan x="290.0" y="371.5">默认勾选自动生成卡片并发布</tspan>
</text>
<rect x="70" y="489" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="532.0">学生｜选择学期及自由组合入口</tspan>
</text>
