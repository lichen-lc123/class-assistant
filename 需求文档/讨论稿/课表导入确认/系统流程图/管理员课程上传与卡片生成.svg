<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2029" viewBox="0 0 1100 2029" role="img" aria-labelledby="title desc">
<title id="title">管理员课程上传与卡片生成 · 系统流程图</title>
<desc id="desc">课表导入待确认设计。系统流程图，包括正常路径及主要异常分支；异常分支在本次处理结束，修正后重新发起。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7E8C7A"/></marker></defs>
<rect width="1100" height="2029" fill="#F7F5F0"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" fill="#344235">
<text x="70" y="55" font-size="29" font-weight="700">管理员课程上传与卡片生成 · 系统流程图</text>
<text x="70" y="90" font-size="15" fill="#788371">V0.5 · 2026-11-02 · 课表按学期管理 · 待确认后开发</text>
<text x="70" y="116" font-size="13" fill="#788371">前端请求、后端校验及数据库处理；右侧为本次处理的其他结果。</text>
<path d="M290.0 219 L290.0 313" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 391 L290.0 485" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="445.0" font-size="15" fill="#66765D">课程资料及默认勾选项</text>
<path d="M290.0 563 L290.0 657" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M510 723.0 L641 723.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="711.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 785 L290.0 829" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="814.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 907 L290.0 1001" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="961.0" font-size="15" fill="#66765D">课程、班级与校验结果</text>
<path d="M510 1067.0 L641 1067.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="1055.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 1129 L290.0 1173" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1158.0" font-size="15" fill="#66765D">是</text>
<path d="M510 1239.0 L641 1239.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="1227.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 1301 L290.0 1345" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1330.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 1423 L290.0 1517" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1477.0" font-size="15" fill="#66765D">保存及卡片生成结果</text>
<path d="M290.0 1595 L290.0 1689" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1649.0" font-size="15" fill="#66765D">管理员发布的可用卡片</text>
<path d="M290.0 1767 L290.0 1861" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="188.0">开始</tspan>
</text>
<rect x="70" y="317" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="348.5">管理员前端｜展示课程上传表单</tspan>
<tspan x="290.0" y="371.5">自动生成课程卡片默认 true</tspan>
</text>
<rect x="70" y="489" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="520.5">前端｜提交学年、学期、课程资料</tspan>
<tspan x="290.0" y="543.5">及 generate_cards 选择</tspan>
</text>
<polygon points="290.0,661 510,723.0 290.0,785 70,723.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="729.0">后端｜当前身份为管理员？</tspan>
</text>
<rect x="645" y="683.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="717.5">拒绝普通用户上传公共课程</tspan>
<tspan x="837.5" y="740.5">或请求生成公共卡片</tspan>
</text>
<rect x="70" y="833" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="864.5">后端｜校验课程、上课班与归属</tspan>
<tspan x="290.0" y="887.5">保留待安排状态并检查重复</tspan>
</text>
<polygon points="290.0,1005 510,1067.0 290.0,1129 70,1067.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="1061.5">后端｜资料有效且</tspan>
<tspan x="290.0" y="1084.5">管理员确认保存？</tspan>
</text>
<rect x="645" y="1027.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="1061.5">返回具体问题</tspan>
<tspan x="837.5" y="1084.5">不写入课程或卡片</tspan>
</text>
<polygon points="290.0,1177 510,1239.0 290.0,1301 70,1239.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="1245.0">后端｜要求自动生成卡片？</tspan>
</text>
<rect x="645" y="1199.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="1233.5">数据库｜仅保存课程</tspan>
<tspan x="837.5" y="1256.5">未生成卡片的新课程不进卡片库</tspan>
</text>
<path d="M70 1362 A220.0 13 0 0 1 510 1362 L510 1410 A220.0 13 0 0 1 70 1410 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 1362 A220.0 13 0 0 0 510 1362" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1380.5">数据库｜事务保存课程与上课班</tspan>
<tspan x="290.0" y="1403.5">生成对应卡片，已有卡片不重复建</tspan>
</text>
<rect x="70" y="1521" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1552.5">后端｜返回上传与卡片生成数量</tspan>
<tspan x="290.0" y="1575.5">仅发布的卡片对学生可见</tspan>
</text>
<rect x="70" y="1693" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1724.5">学生前端｜请求课程卡片搜索</tspan>
<tspan x="290.0" y="1747.5">后端仅返回管理员发布的卡片</tspan>
</text>
<rect x="70" y="1865" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1908.0">结束</tspan>
</text>
<text x="70" y="1999" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
</g></svg>