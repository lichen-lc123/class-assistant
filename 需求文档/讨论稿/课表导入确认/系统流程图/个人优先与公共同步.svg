<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1857" viewBox="0 0 1100 1857" role="img" aria-labelledby="title desc">
<title id="title">个人优先与公共同步 · 系统流程图</title>
<desc id="desc">课表导入待确认设计。系统流程图，包括正常路径及主要异常分支；异常分支在本次处理结束，修正后重新发起。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7E8C7A"/></marker></defs>
<rect width="1100" height="1857" fill="#F7F5F0"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" fill="#344235">
<text x="70" y="55" font-size="29" font-weight="700">个人优先与公共同步 · 系统流程图</text>
<text x="70" y="90" font-size="15" fill="#788371">V0.5 · 2026-11-02 · 课表按学期管理 · 待确认后开发</text>
<text x="70" y="116" font-size="13" fill="#788371">前端请求、后端校验及数据库处理；右侧为本次处理的其他结果。</text>
