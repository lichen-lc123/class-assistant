<tspan x="290.0" y="1208.5">前端｜展示本人最终课表</tspan>
<tspan x="290.0" y="1231.5">及公共变动、个人覆盖提示</tspan>
</text>
<polygon points="290.0,1349 510,1411.0 290.0,1473 70,1411.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="1417.0">学生｜选择保留个人覆盖？</tspan>
</text>
<rect x="645" y="1371.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="1405.5">数据库｜清除所选字段覆盖</tspan>
<tspan x="837.5" y="1428.5">重新采用公共值</tspan>
</text>
<path d="M70 1534 A220.0 13 0 0 1 510 1534 L510 1582 A220.0 13 0 0 1 70 1582 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 1534 A220.0 13 0 0 0 510 1534" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1552.5">数据库｜保留个人覆盖</tspan>
<tspan x="290.0" y="1575.5">仅影响当前用户课表</tspan>
</text>
<rect x="70" y="1693" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1736.0">结束</tspan>
</text>
<text x="70" y="1827" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
</g></svg>