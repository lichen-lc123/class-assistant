<tspan x="290.0" y="188.0">开始</tspan>
</text>
<path d="M70 330 A220.0 13 0 0 1 510 330 L510 378 A220.0 13 0 0 1 70 378 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 330 A220.0 13 0 0 0 510 330" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="348.5">数据库｜读取公共安排更新</tspan>
<tspan x="290.0" y="371.5">以及受影响用户的选班关系</tspan>
</text>
