<tspan x="837.5" y="509.0">后端｜拒绝读取他人课程</tspan>
</text>
<rect x="70" y="639" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="670.5">后端｜按课程引用或完整身份匹配作业</tspan>
<tspan x="290.0" y="693.5">合成本人状态并分组</tspan>
