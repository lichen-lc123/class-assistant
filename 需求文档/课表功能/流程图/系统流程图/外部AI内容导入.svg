<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2201" viewBox="0 0 1100 2201" role="img" aria-labelledby="title desc">
<title id="title">外部AI内容导入 · 系统流程图</title>
<desc id="desc">一期已实现功能。系统流程图，包括正常路径及主要异常分支；异常分支在本次处理结束，修正后重新发起。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7E8C7A"/></marker></defs>
<rect width="1100" height="2201" fill="#F7F5F0"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" fill="#344235">
<text x="70" y="55" font-size="29" font-weight="700">外部AI内容导入 · 系统流程图</text>
<text x="70" y="90" font-size="15" fill="#788371">V1.0 · 2026-11-02 · 课表功能 · 已实现</text>
<text x="70" y="116" font-size="13" fill="#788371">前端请求、后端校验及数据库处理；右侧为本次处理的其他结果。</text>
<path d="M290.0 219 L290.0 313" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 391 L290.0 485" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="445.0" font-size="15" fill="#66765D">提示词与用户提供的原始资料</text>
<path d="M290.0 563 L290.0 657" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="617.0" font-size="15" fill="#66765D">用户复制回来的 JSON</text>
<path d="M290.0 735 L290.0 829" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M510 895.0 L641 895.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="883.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 957 L290.0 1001" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="986.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 1079 L290.0 1173" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M510 1239.0 L641 1239.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="1227.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 1301 L290.0 1345" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1330.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 1423 L290.0 1517" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1477.0" font-size="15" fill="#66765D">公共候选、教学日历及作息</text>
<path d="M290.0 1595 L290.0 1689" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1649.0" font-size="15" fill="#66765D">日期预览、缺失及冲突提示</text>
<path d="M290.0 1767 L290.0 1861" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1821.0" font-size="15" fill="#66765D">用户确认结果和个人修改</text>
<path d="M290.0 1939 L290.0 2033" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="188.0">开始</tspan>
</text>
<rect x="70" y="317" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="348.5">前端｜复制提示词</tspan>
<tspan x="290.0" y="371.5">网站不发送资料到 AI</tspan>
</text>
<rect x="70" y="489" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="520.5">学生与外部 AI｜在网站外处理</tspan>
<tspan x="290.0" y="543.5">原始资料 → JSON</tspan>
</text>
<rect x="70" y="661" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="692.5">前端｜提交学期与 JSON</tspan>
<tspan x="290.0" y="715.5">source=ai</tspan>
</text>
<polygon points="290.0,833 510,895.0 290.0,957 70,895.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="889.5">后端｜该用户本学期允许</tspan>
<tspan x="290.0" y="912.5">使用当前来源？</tspan>
</text>
<rect x="645" y="855.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="889.5">已有其他来源时拒绝</tspan>
<tspan x="837.5" y="912.5">提示先删除原课表</tspan>
</text>
<rect x="70" y="1005" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1036.5">后端｜解析 JSON 与版本</tspan>
<tspan x="290.0" y="1059.5">校验字段、学期、班号和规则</tspan>
</text>
<polygon points="290.0,1177 510,1239.0 290.0,1301 70,1239.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="1233.5">后端｜结构与必要字段</tspan>
<tspan x="290.0" y="1256.5">是否有效？</tspan>
</text>
<rect x="645" y="1199.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="1233.5">返回具体问题与修正建议</tspan>
<tspan x="837.5" y="1256.5">不保存为正式课表</tspan>
</text>
<path d="M70 1362 A220.0 13 0 0 1 510 1362 L510 1410 A220.0 13 0 0 1 70 1410 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 1362 A220.0 13 0 0 0 510 1362" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1380.5">数据库｜读取公共上课班候选</tspan>
<tspan x="290.0" y="1403.5">教学日历与节次作息</tspan>
</text>
<rect x="70" y="1521" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1552.5">后端｜生成日期预览及待确认项</tspan>
<tspan x="290.0" y="1575.5">保留原文；未绑定班号不自动关联作业</tspan>
</text>
<rect x="70" y="1693" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1724.5">前端｜显示预览与问题清单</tspan>
<tspan x="290.0" y="1747.5">用户确认个人信息与匹配结果</tspan>
</text>
<path d="M70 1878 A220.0 13 0 0 1 510 1878 L510 1926 A220.0 13 0 0 1 70 1926 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 1878 A220.0 13 0 0 0 510 1878" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1896.5">数据库｜确认时重新校验学期来源</tspan>
<tspan x="290.0" y="1919.5">保存个人课表、原文与个人覆盖</tspan>
</text>
<rect x="70" y="2037" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="2080.0">结束</tspan>
</text>
<text x="70" y="2171" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
</g></svg>