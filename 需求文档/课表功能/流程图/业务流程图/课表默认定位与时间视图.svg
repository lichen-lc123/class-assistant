<path d="M290.0 811 L290.0 881" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 959 L290.0 1029" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
