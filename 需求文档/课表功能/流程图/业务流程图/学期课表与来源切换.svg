<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1409" viewBox="0 0 1100 1409" role="img" aria-labelledby="title desc">
<title id="title">学期课表与来源切换 · 业务流程图</title>
<desc id="desc">当前已实现功能。业务流程图，包括正常路径及主要异常分支；异常分支在本次处理结束，修正后重新发起。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7E8C7A"/></marker></defs>
<rect width="1100" height="1409" fill="#F7F5F0"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" fill="#344235">
<text x="70" y="55" font-size="29" font-weight="700">学期课表与来源切换 · 业务流程图</text>
<text x="70" y="90" font-size="15" fill="#788371">当前版 · 2026-11-09 · MEM2602 当前业务规则</text>
<text x="70" y="116" font-size="13" fill="#788371">使用者操作与业务判断；右侧为本次处理的其他结果。</text>
<path d="M290.0 219 L290.0 289" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 367 L290.0 437" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 515 L290.0 585" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 663 L290.0 733" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M510 799.0 L641 799.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="787.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 861 L290.0 931" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="903.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 1009 L290.0 1079" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 1157 L290.0 1227" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="188.0">开始</tspan>
</text>
<rect x="70" y="293" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="336.0">用户｜进入我的课程并读取当前学期</tspan>
</text>
<rect x="70" y="441" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="484.0">用户｜到课表管理选择 AI、模板或卡片</tspan>
</text>
<rect x="70" y="589" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="632.0">网站｜与已有全部学期及本次课程检查时间</tspan>
</text>
<polygon points="290.0,737 510,799.0 290.0,861 70,799.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="793.5">网站｜没有时间冲突且版本</tspan>
<tspan x="290.0" y="816.5">有效？</tspan>
</text>
<rect x="645" y="759.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="793.5">网站｜提示重叠课程和日期</tspan>
<tspan x="837.5" y="816.5">保留原课表</tspan>
</text>
<rect x="70" y="935" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="978.0">网站｜追加到本人同一学期课表</tspan>
</text>
<rect x="70" y="1083" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1114.5">用户｜可调整个人安排</tspan>
<tspan x="290.0" y="1137.5">或确认清空本学期后重新导入</tspan>
</text>
<rect x="70" y="1231" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1274.0">结束</tspan>
</text>
<text x="70" y="1379" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
</g></svg>