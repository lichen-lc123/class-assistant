<tspan x="290.0" y="1076.0">结束</tspan>
</text>
<text x="70" y="1181" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
