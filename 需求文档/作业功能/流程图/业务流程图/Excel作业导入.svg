<path d="M290.0 1305 L290.0 1375" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="188.0">开始</tspan>
</text>
<rect x="70" y="293" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="336.0">管理员｜选择学期及 XLSX 作业表</tspan>
</text>
<rect x="70" y="441" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="472.5">网站｜解析内容、图片、文件和链接</tspan>
<tspan x="290.0" y="495.5">“无”不生成作业</tspan>
</text>
<rect x="70" y="589" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="620.5">网站｜无上课时间则匹配同名同老师全部课</tspan>
<tspan x="290.0" y="643.5">有明确时间则按时间核对</tspan>
</text>
<polygon points="290.0,737 510,799.0 290.0,861 70,799.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="793.5">网站｜范围及内容可可靠确</tspan>
<tspan x="290.0" y="816.5">定？</tspan>
</text>
<rect x="645" y="759.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="793.5">网站｜保留原文为待确认草稿</tspan>
<tspan x="837.5" y="816.5">缺课程可等待补齐后重查</tspan>
</text>
<rect x="70" y="935" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="966.5">管理员｜核对并确认导入</tspan>
<tspan x="290.0" y="989.5">无截止时间不阻止发布</tspan>
</text>
<rect x="70" y="1083" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1114.5">网站｜同课程、老师、作业次数</tspan>
<tspan x="290.0" y="1137.5">更新原内容并保留个人状态</tspan>
</text>
<rect x="70" y="1231" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1274.0">网站｜反馈新增、更新及草稿数量</tspan>
</text>
<rect x="70" y="1379" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1422.0">结束</tspan>
</text>
<text x="70" y="1527" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
