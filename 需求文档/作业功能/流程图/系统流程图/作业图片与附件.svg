<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1857" viewBox="0 0 1100 1857" role="img" aria-labelledby="title desc">
<title id="title">作业图片与附件 · 系统流程图</title>
<desc id="desc">一期已实现功能。系统流程图，包括正常路径及主要异常分支；异常分支在本次处理结束，修正后重新发起。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7E8C7A"/></marker></defs>
<rect width="1100" height="1857" fill="#F7F5F0"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" fill="#344235">
<text x="70" y="55" font-size="29" font-weight="700">作业图片与附件 · 系统流程图</text>
<text x="70" y="90" font-size="15" fill="#788371">V1.0 · 2026-11-06 · 作业功能 · 已实现</text>
<text x="70" y="116" font-size="13" fill="#788371">前端请求、后端校验及数据库处理；右侧为本次处理的其他结果。</text>
<path d="M290.0 219 L290.0 313" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 391 L290.0 485" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="445.0" font-size="15" fill="#66765D">新文件字节、摘要与所选关联</text>
<path d="M290.0 563 L290.0 657" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="617.0" font-size="15" fill="#66765D">会话、作业版本、附件与资料</text>
<path d="M290.0 735 L290.0 829" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="789.0" font-size="15" fill="#66765D">已验证内容与文件权限</text>
<path d="M290.0 907 L290.0 1001" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="961.0" font-size="15" fill="#66765D">文件名、大小、MIME及授权URL</text>
<path d="M290.0 1079 L290.0 1173" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1133.0" font-size="15" fill="#66765D">作业ID、文件ID、登录会话</text>
<path d="M290.0 1251 L290.0 1345" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1305.0" font-size="15" fill="#66765D">有效附件关联与授权字节</text>
<path d="M290.0 1423 L290.0 1517" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1477.0" font-size="15" fill="#66765D">后续编辑及保留或移除操作</text>
<path d="M290.0 1595 L290.0 1689" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="188.0">开始</tspan>
</text>
<rect x="70" y="317" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="348.5">前端｜读取文件字节与摘要</tspan>
<tspan x="290.0" y="371.5">展示文件名、大小、图片预览</tspan>
</text>
<rect x="70" y="489" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="520.5">前端｜随作业提交附件关联</tspan>
<tspan x="290.0" y="543.5">新文件字节、当前版本及会话</tspan>
</text>
<rect x="70" y="661" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="692.5">后端｜检查身份、选课与作业权限</tspan>
<tspan x="290.0" y="715.5">校验文件摘要、大小及真实图片类型</tspan>
</text>
<path d="M70 846 A220.0 13 0 0 1 510 846 L510 894 A220.0 13 0 0 1 70 894 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 846 A220.0 13 0 0 0 510 846" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="864.5">数据库｜事务保存作业和BLOB</tspan>
<tspan x="290.0" y="887.5">登记附件关联与本作业文件名</tspan>
</text>
<rect x="70" y="1005" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1036.5">前端｜读取授权附件URL</tspan>
<tspan x="290.0" y="1059.5">显示图片和下载入口</tspan>
</text>
<rect x="70" y="1177" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1208.5">后端｜每次下载校验作业可见范围</tspan>
<tspan x="290.0" y="1231.5">及当前附件关联</tspan>
</text>
<rect x="70" y="1349" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1380.5">后端｜图片按检测格式返回</tspan>
<tspan x="290.0" y="1403.5">其他文件强制下载并禁止嗅探</tspan>
</text>
<path d="M70 1534 A220.0 13 0 0 1 510 1534 L510 1582 A220.0 13 0 0 1 70 1582 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 1534 A220.0 13 0 0 0 510 1534" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1552.5">数据库｜编辑后更新附件关联</tspan>
<tspan x="290.0" y="1575.5">移除的原作业链接失效</tspan>
</text>
<rect x="70" y="1693" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1736.0">结束</tspan>
</text>
<text x="70" y="1827" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
</g></svg>