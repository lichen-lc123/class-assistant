<text x="305.0" y="1275.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 1407 L290.0 1477" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 1555 L290.0 1625" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="188.0">开始</tspan>
</text>
<rect x="70" y="293" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="324.5">前端｜携带会话读取管理清单</tspan>
<tspan x="290.0" y="347.5">不按 created_by 筛选</tspan>
</text>
<polygon points="290.0,441 510,503.0 290.0,565 70,503.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="497.5">后端｜管理员且完成首次改</tspan>
<tspan x="290.0" y="520.5">密？</tspan>
</text>
<rect x="645" y="463.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="509.0">后端｜返回 401 或 403</tspan>
</text>
<rect x="70" y="639" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="670.5">前端｜提交多个课程目标</tspan>
<tspan x="290.0" y="693.5">人工编辑不隐式发布</tspan>
</text>
<path d="M70 800 A220.0 13 0 0 1 510 800 L510 874 A220.0 13 0 0 1 70 874 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
