<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="831.5">数据库｜事务更新字段、附件及版本</tspan>
<tspan x="290.0" y="854.5">保留个人计划和全员状态策略</tspan>
</text>
<rect x="70" y="961" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1004.0">前端｜独立提交 publish 与 revision</tspan>
</text>
<polygon points="290.0,1109 510,1171.0 290.0,1233 70,1171.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="1165.5">后端｜目标有效且待确认内</tspan>
<tspan x="290.0" y="1188.5">容已核对？</tspan>
</text>
<rect x="645" y="1131.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="1177.0">后端｜保留草稿，不强制填写截止</tspan>
</text>
<path d="M70 1320 A220.0 13 0 0 1 510 1320 L510 1394 A220.0 13 0 0 1 70 1394 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 1320 A220.0 13 0 0 0 510 1320" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1363.0">数据库｜发布记录及多课程关联</tspan>
</text>
<rect x="70" y="1481" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1512.5">后端｜普通用户按已选课程读取</tspan>
<tspan x="290.0" y="1535.5">无截止时返回空日期而非虚构时间</tspan>
</text>
<rect x="70" y="1629" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1672.0">结束</tspan>
</text>
<text x="70" y="1777" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
</g></svg>