<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2029" viewBox="0 0 1100 2029" role="img" aria-labelledby="title desc">
<title id="title">作业完成与提醒停止 · 系统流程图</title>
<desc id="desc">一期已实现功能。系统流程图，包括正常路径及主要异常分支；异常分支在本次处理结束，修正后重新发起。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7E8C7A"/></marker></defs>
<rect width="1100" height="2029" fill="#F7F5F0"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" fill="#344235">
<text x="70" y="55" font-size="29" font-weight="700">作业完成与提醒停止 · 系统流程图</text>
<text x="70" y="90" font-size="15" fill="#788371">V1.0 · 2026-11-06 · 作业功能 · 已实现</text>
<text x="70" y="116" font-size="13" fill="#788371">前端请求、后端校验及数据库处理；右侧为本次处理的其他结果。</text>
<path d="M290.0 219 L290.0 313" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 391 L290.0 485" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="445.0" font-size="15" fill="#66765D">会话、作业编号、版本</text>
<path d="M290.0 563 L290.0 657" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="617.0" font-size="15" fill="#66765D">本人可见的最新作业</text>
<path d="M290.0 735 L290.0 829" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="789.0" font-size="15" fill="#66765D">completed=true及当前版本</text>
<path d="M510 895.0 L641 895.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="883.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 957 L290.0 1001" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="986.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 1079 L290.0 1173" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1133.0" font-size="15" fill="#66765D">完成状态及时间</text>
<path d="M290.0 1251 L290.0 1345" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1305.0" font-size="15" fill="#66765D">后续发送或重试请求</text>
<path d="M290.0 1423 L290.0 1517" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1477.0" font-size="15" fill="#66765D">最新完成、权限、偏好及版本</text>
<path d="M510 1583.0 L641 1583.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="1571.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 1645 L290.0 1689" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1674.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 1767 L290.0 1861" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="188.0">开始</tspan>
</text>
<rect x="70" y="317" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="348.5">前端｜页面完成操作或站内链接</tspan>
<tspan x="290.0" y="371.5">携带作业编号及提醒版本</tspan>
</text>
<rect x="70" y="489" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="520.5">后端｜详情GET只读</tspan>
<tspan x="290.0" y="543.5">检查登录与本人可见范围</tspan>
</text>
<rect x="70" y="661" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="692.5">前端｜展示最新内容及版本变化</tspan>
<tspan x="290.0" y="715.5">用户明确确认后提交POST</tspan>
</text>
<polygon points="290.0,833 510,895.0 290.0,957 70,895.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="889.5">后端｜权限及</tspan>
<tspan x="290.0" y="912.5">当前作业版本有效？</tspan>
</text>
<rect x="645" y="855.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="889.5">前端｜显示无权限或版本冲突</tspan>
<tspan x="837.5" y="912.5">刷新内容后再确认</tspan>
</text>
<path d="M70 1018 A220.0 13 0 0 1 510 1018 L510 1066 A220.0 13 0 0 1 70 1066 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 1018 A220.0 13 0 0 0 510 1018" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1036.5">数据库｜按用户与作业保存完成版本</tspan>
<tspan x="290.0" y="1059.5">重复动作不改首次完成时间</tspan>
</text>
<rect x="70" y="1177" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1208.5">前端｜显示已完成并刷新</tspan>
<tspan x="290.0" y="1231.5">待做列表及工作台摘要</tspan>
</text>
<rect x="70" y="1349" width="440" height="74" rx="12" fill="#FFFFFF" stroke="#A8B2A2" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1380.5">后续发送器｜每次发出前调用</tspan>
<tspan x="290.0" y="1403.5">reminderCandidate重新检查数据库</tspan>
</text>
<polygon points="290.0,1521 510,1583.0 290.0,1645 70,1583.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="1577.5">后端｜作业未完成、版本</tspan>
<tspan x="290.0" y="1600.5">可见权限和开关仍有效？</tspan>
</text>
<rect x="645" y="1543.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="1577.5">后续发送器｜放弃该次提醒</tspan>
<tspan x="837.5" y="1600.5">包含早先取得的候选及重试</tspan>
</text>
<rect x="70" y="1693" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1724.5">后端｜返回可继续处理的候选</tspan>
<tspan x="290.0" y="1747.5">实际发送另需接通消息通道</tspan>
</text>
<rect x="70" y="1865" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1908.0">结束</tspan>
</text>
<text x="70" y="1999" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
</g></svg>