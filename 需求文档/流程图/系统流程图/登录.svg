<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1287" viewBox="0 0 1100 1287" role="img" aria-labelledby="title desc">
<title id="title">登录 · 系统流程图</title>
<desc id="desc">当前已实现功能。系统流程图，包括正常路径及主要异常分支；带回线的分支继续后续步骤；其余结果可修正后重试。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7E8C7A"/></marker></defs>
<rect width="1100" height="1287" fill="#F7F5F0"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" fill="#344235">
<text x="70" y="55" font-size="29" font-weight="700">登录 · 系统流程图</text>
<text x="70" y="90" font-size="15" fill="#788371">当前版 · 2026-11-09 · MEM2602 当前业务规则</text>
<text x="70" y="116" font-size="13" fill="#788371">前端请求、后端校验及数据库处理；右侧为本次处理的其他结果。</text>
<path d="M290.0 219 L290.0 289" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 367 L290.0 437" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M510 503.0 L641 503.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="491.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 565 L290.0 635" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="607.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 739 L290.0 809" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 887 L290.0 957" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 1035 L290.0 1105" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="188.0">开始</tspan>
</text>
<rect x="70" y="293" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="324.5">前端｜请求 /auth/me</tspan>
<tspan x="290.0" y="347.5">发送浏览器保存的 Cookie</tspan>
</text>
<polygon points="290.0,441 510,503.0 290.0,565 70,503.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="497.5">后端｜会话未撤销且账号有</tspan>
<tspan x="290.0" y="520.5">效？</tspan>
</text>
<rect x="645" y="463.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="497.5">后端｜登录接口校验账号及密码</tspan>
<tspan x="837.5" y="520.5">成功新建会话，失败留在登录页</tspan>
</text>
<path d="M70 652 A220.0 13 0 0 1 510 652 L510 726 A220.0 13 0 0 1 70 726 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 652 A220.0 13 0 0 0 510 652" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="683.5">数据库｜读取会话摘要及最新账号角色</tspan>
<tspan x="290.0" y="706.5">expires_at=0 表示不按时间失效</tspan>
</text>
<rect x="70" y="813" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="844.5">后端｜刷新 HttpOnly 登录 Cookie</tspan>
<tspan x="290.0" y="867.5">返回本人资料及改密标记</tspan>
</text>
<rect x="70" y="961" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="992.5">前端｜按改密状态和设备展示入口</tspan>
<tspan x="290.0" y="1015.5">手机只展示个人功能</tspan>
</text>
<rect x="70" y="1109" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1152.0">结束</tspan>
</text>
<text x="70" y="1257" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
<path d="M1030 503.0 L1070 503.0 L1070 602 L290.0 602 L290.0 635" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/></g></svg>