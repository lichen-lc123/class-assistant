<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1685" viewBox="0 0 1100 1685" role="img" aria-labelledby="title desc">
<title id="title">登录 · 系统流程图</title>
<desc id="desc">一期已实现功能。系统流程图，包括正常路径及主要异常分支；异常分支在本次处理结束，修正后重新发起。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7E8C7A"/></marker></defs>
<rect width="1100" height="1685" fill="#F7F5F0"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" fill="#344235">
<text x="70" y="55" font-size="29" font-weight="700">登录 · 系统流程图</text>
<text x="70" y="90" font-size="15" fill="#788371">V1.0 · 2026-11-02 · 一期登录与账号管理</text>
<text x="70" y="116" font-size="13" fill="#788371">前端请求、后端校验及数据库处理；右侧为本次处理的其他结果。</text>
<path d="M290.0 219 L290.0 313" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 391 L290.0 485" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 563 L290.0 657" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M510 723.0 L641 723.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="711.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 785 L290.0 829" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="814.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 907 L290.0 1001" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M290.0 1079 L290.0 1173" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<path d="M510 1239.0 L641 1239.0" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="569.5" y="1227.0" font-size="15" fill="#66765D">否</text>
<path d="M290.0 1301 L290.0 1345" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<text x="305.0" y="1330.0" font-size="15" fill="#66765D">是</text>
<path d="M290.0 1423 L290.0 1517" stroke="#7E8C7A" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="145" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="188.0">开始</tspan>
</text>
<rect x="70" y="317" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="360.0">前端｜检查必填并提交登录</tspan>
</text>
<rect x="70" y="489" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="532.0">后端｜校验来源、JSON 与尝试次数</tspan>
</text>
<polygon points="290.0,661 510,723.0 290.0,785 70,723.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="717.5">后端｜密码验证通过且</tspan>
<tspan x="290.0" y="740.5">账号未被删除或重置？</tspan>
</text>
<rect x="645" y="683.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="729.0">返回登录失败或频次限制</tspan>
</text>
<path d="M70 846 A220.0 13 0 0 1 510 846 L510 894 A220.0 13 0 0 1 70 894 Z" fill="#E7EDF0" stroke="#8A9CA6" stroke-width="1.6"/>
<path d="M70 846 A220.0 13 0 0 0 510 846" stroke="#8A9CA6" fill="none"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="864.5">数据库｜保存新会话摘要</tspan>
<tspan x="290.0" y="887.5">保持登录，访问刷新凭据</tspan>
</text>
<rect x="70" y="1005" width="440" height="74" rx="12" fill="#F2EFE8" stroke="#A59D8B" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1036.5">后端｜设置 HttpOnly Cookie</tspan>
<tspan x="290.0" y="1059.5">返回账号、角色及改密标记</tspan>
</text>
<polygon points="290.0,1177 510,1239.0 290.0,1301 70,1239.0" fill="#F0ECE2" stroke="#A69B83" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="290.0" y="1245.0">前端｜必须先修改密码？</tspan>
</text>
<rect x="645" y="1199.0" width="385" height="80" rx="12" fill="#F2EAE6" stroke="#B09B91" stroke-width="1.6"/>
<text text-anchor="middle" font-size="16">
<tspan x="837.5" y="1233.5">按角色渲染系统设置</tspan>
<tspan x="837.5" y="1256.5">或我的账号</tspan>
</text>
<rect x="70" y="1349" width="440" height="74" rx="12" fill="#EDF1E9" stroke="#95A08D" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1392.0">前端｜渲染强制修改密码表单</tspan>
</text>
<rect x="70" y="1521" width="440" height="74" rx="37.0" fill="#E5ECE2" stroke="#8A9D82" stroke-width="1.6"/>
<text text-anchor="middle" font-size="17">
<tspan x="290.0" y="1564.0">结束</tspan>
</text>
<text x="70" y="1655" font-size="13" fill="#88917F">图例：圆角端点＝开始 / 结束；矩形＝处理；菱形＝判断；圆柱＝数据库；右侧＝其他结果。</text>
</g></svg>
